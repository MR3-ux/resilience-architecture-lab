name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source
        run: PYTHONPATH=src python -m compileall -q src tests

      - name: Run dependency-free quality checks
        run: python scripts/quality.py

      - name: Check shell scripts
        run: shellcheck scripts/demo.sh

      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Validate reference examples
        run: |
          PYTHONPATH=src python -m resilience_lab validate examples/azure-active-active.json
          PYTHONPATH=src python -m resilience_lab validate examples/fragile-single-region.json

      - name: Generate reproducible report
        run: PYTHONPATH=src python -m resilience_lab assess examples/azure-active-active.json --output-dir reports/ci

      - name: Upload assessment evidence
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: resilience-assessment
          path: reports/ci/
